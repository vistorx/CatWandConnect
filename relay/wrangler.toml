name = "catwandconnect-support"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
REPOSITORY = "vistorx/CatWandConnect"
# Kill switch: "false" makes the relay answer 503 "unavailable" and the
# Device interface falls back to the prefilled issue. Change it in the
# Cloudflare dashboard (Workers → catwandconnect-support → Settings →
# Variables) for an immediate effect, then here so the next deploy keeps it.
ENABLED = "true"
# Issues the relay may create per UTC day, all robots together.
DAILY_CAP = "30"

# Per-IP limit: 3 reports per minute.
[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[observability]
enabled = true

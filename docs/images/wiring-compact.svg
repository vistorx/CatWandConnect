<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 325" width="640" height="325" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="640" height="325" rx="14" fill="#ffffff"/>
<defs><marker id="arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs>
<!-- USB-C power chain -->
<rect x="20" y="14" width="150" height="52" rx="10" fill="#fff4e5" stroke="#1d1d1f" stroke-width="2"/>
<text x="95" y="36" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">USB-C charger</text>
<text x="95" y="54" font-size="12" fill="#555" text-anchor="middle">PD, 30–45 W</text>
<line x1="170" y1="40" x2="216" y2="40" stroke="#1d1d1f" stroke-width="3" marker-end="url(#arrow-c)"/>
<rect x="220" y="14" width="150" height="52" rx="10" fill="#fff4e5" stroke="#1d1d1f" stroke-width="2"/>
<text x="295" y="36" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">PD trigger</text>
<text x="295" y="54" font-size="12" fill="#555" text-anchor="middle">set to 20 V</text>
<path d="M295 66 L295 80 L85 80 L85 146" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-c)"/>
<text x="305" y="78" font-size="11" font-weight="700" fill="#555">20 V</text>
<g transform="translate(0,80)">
<!-- buck converter -->
<rect x="20" y="70" width="130" height="80" rx="10" fill="#fff4e5" stroke="#1d1d1f" stroke-width="2"/>
<text x="85" y="104" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">Buck converter</text>
<text x="85" y="124" font-size="13" fill="#555" text-anchor="middle">→ 5 V, 5 A+</text>
<!-- rails -->
<line x1="150" y1="90" x2="300" y2="90" stroke="#d62828" stroke-width="5"/>
<line x1="150" y1="130" x2="300" y2="130" stroke="#1d1d1f" stroke-width="5"/>
<line x1="300" y1="40" x2="300" y2="180" stroke="#d62828" stroke-width="5"/>
<line x1="320" y1="40" x2="320" y2="180" stroke="#1d1d1f" stroke-width="5"/>
<line x1="150" y1="130" x2="293" y2="130" stroke="#1d1d1f" stroke-width="5"/>
<line x1="307" y1="130" x2="320" y2="130" stroke="#1d1d1f" stroke-width="5"/>
<path d="M293 130 Q300 116 307 130" fill="none" stroke="#1d1d1f" stroke-width="4"/>
<text x="225" y="82" font-size="12" font-weight="700" fill="#d62828" text-anchor="middle">+5 V</text>
<text x="225" y="148" font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="middle">GND</text>
<!-- servos -->
<rect x="460" y="20" width="160" height="60" rx="10" fill="#e8f1fb" stroke="#1d1d1f" stroke-width="2"/>
<text x="540" y="46" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">Horizontal servo</text>
<text x="540" y="65" font-size="12" fill="#555" text-anchor="middle">MG996R or DS3218</text>
<rect x="460" y="140" width="160" height="60" rx="10" fill="#e8f1fb" stroke="#1d1d1f" stroke-width="2"/>
<text x="540" y="166" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">Vertical servo</text>
<text x="540" y="185" font-size="12" fill="#555" text-anchor="middle">MG996R or DS3218</text>
<line x1="300" y1="40" x2="460" y2="40" stroke="#d62828" stroke-width="3"/>
<line x1="320" y1="60" x2="460" y2="60" stroke="#1d1d1f" stroke-width="3"/>
<line x1="300" y1="160" x2="460" y2="160" stroke="#d62828" stroke-width="3"/>
<line x1="320" y1="180" x2="460" y2="180" stroke="#1d1d1f" stroke-width="3"/>
<!-- board -->
<rect x="350" y="88" width="110" height="44" rx="8" fill="#eef7ee" stroke="#1d1d1f" stroke-width="2"/>
<text x="405" y="115" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">ESP32</text>
<line x1="300" y1="100" x2="350" y2="100" stroke="#d62828" stroke-width="3"/>
<line x1="320" y1="120" x2="350" y2="120" stroke="#1d1d1f" stroke-width="3"/>
<!-- signals -->
<path d="M440 88 L440 72 L460 72" fill="none" stroke="#f08c00" stroke-width="3"/>
<path d="M440 132 L440 150 L460 150" fill="none" stroke="#f08c00" stroke-width="3"/>
<text x="20" y="230" font-size="12" fill="#555">Orange = signal (GPIO 18 / 19 on ESP32). Full diagram in docs/wiring.md.</text>
</g>
</svg>

esphome:
  name: "cat-playing-platform"
  friendly_name: Cat playing platform
  on_boot:
    lambda: |-
      srand((unsigned int)time(nullptr));

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.142
    subnet: 192.168.1.0
    gateway: 255.255.255.0
  ap:
    ssid: "Cat-Bot Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

# ---------------------------------------------------------------------------
# SERVOS
# ---------------------------------------------------------------------------
servo:
  - id: servo_horizontal
    output: output1
    min_level: 2%
    idle_level: 6.5%
    max_level: 11%
    transition_length: 100ms
    auto_detach_time: 1000ms
  - id: servo_vertical
    output: output2
    min_level: 3%
    idle_level: 7.5%
    max_level: 12%
    transition_length: 100ms
    auto_detach_time: 1000ms

output:
  - platform: ledc
    id: output1
    pin: GPIO18
    frequency: 50 Hz
  - platform: ledc
    id: output2
    pin: GPIO19
    frequency: 50 Hz

# ---------------------------------------------------------------------------
# GLOBALS
# ---------------------------------------------------------------------------
globals:

  # --- Session ---
  - id: session_start_time
    type: long
    restore_value: no
    initial_value: "0"
  - id: session_end_time
    type: long
    restore_value: no
    initial_value: "0"

  # --- Horizontal axis state machine ---
  # 0 = idle  1 = moving  2 = inter-movement pause
  - id: state_horizontal
    type: int
    restore_value: no
    initial_value: "0"
  - id: servo_horizontal_position
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: servo_target_horizontal_position
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: horizontal_step
    type: float
    restore_value: no
    initial_value: "0.0"
  # Millis timestamp for the end of the horizontal inter-movement pause
  - id: horizontal_pause_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # --- Vertical axis state machine ---
  # 0 = idle  1 = moving  2 = inter-movement pause
  - id: state_vertical
    type: int
    restore_value: no
    initial_value: "0"
  - id: servo_vertical_position
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: servo_target_vertical_position
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: vertical_step
    type: float
    restore_value: no
    initial_value: "0.0"
  # Millis timestamp for the end of the vertical inter-movement pause
  - id: vertical_pause_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

# ---------------------------------------------------------------------------
# SWITCHES
# ---------------------------------------------------------------------------
switch:
  - id: horizontal_inversion
    platform: template
    name: "Horizontal inversion"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: ESP_LOGI("custom", "horizontal_inversion = ON");
    on_turn_off:
      - lambda: ESP_LOGI("custom", "horizontal_inversion = OFF");

  - id: vertical_inversion
    platform: template
    name: "Vertical inversion"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: ESP_LOGI("custom", "vertical_inversion = ON");
    on_turn_off:
      - lambda: ESP_LOGI("custom", "vertical_inversion = OFF");

# ---------------------------------------------------------------------------
# NUMBERS
# ---------------------------------------------------------------------------
number:
  # Manual position sliders
  - id: servo_horizontal_slider
    platform: template
    name: Horizontal servo slider
    optimistic: True
    min_value: -100
    max_value: 100
    initial_value: 0
    step: 1
    on_value:
      then:
        - servo.write:
            id: servo_horizontal
            level: !lambda |-
              return id(horizontal_inversion).state ? x / 100.0f * -1.0f : x / 100.0f;

  - id: servo_vertical_slider
    platform: template
    name: Vertical servo slider
    optimistic: True
    min_value: -100
    max_value: 100
    initial_value: 0
    step: 1
    on_value:
      then:
        - servo.write:
            id: servo_vertical
            level: !lambda |-
              return id(vertical_inversion).state ? x / 100.0f * -1.0f : x / 100.0f;

  # Session duration
  - id: cat_playing_session_duration_minutes
    platform: template
    name: cat_playing_session_duration_minutes
    optimistic: True
    restore_value: true
    min_value: 1
    max_value: 60
    initial_value: 1
    step: 1

  # Inter-movement pauses (ms)
  - id: horizontal_minimal_pause
    platform: template
    name: horizontal_minimal_pause
    optimistic: True
    restore_value: True
    initial_value: 500
    min_value: 0
    max_value: 10000
    step: 50
  - id: horizontal_maximal_pause
    platform: template
    name: horizontal_maximal_pause
    optimistic: True
    restore_value: True
    initial_value: 2000
    min_value: 0
    max_value: 10000
    step: 50
  - id: vertical_minimal_pause
    platform: template
    name: vertical_minimal_pause
    optimistic: True
    restore_value: True
    initial_value: 200
    min_value: 0
    max_value: 10000
    step: 50
  - id: vertical_maximal_pause
    platform: template
    name: vertical_maximal_pause
    optimistic: True
    restore_value: True
    initial_value: 1000
    min_value: 0
    max_value: 10000
    step: 50

  # Range (values between -100 and 100)
  - id: horizontal_minimum_movement
    platform: template
    name: horizontal_minimal_movement
    optimistic: True
    restore_value: True
    initial_value: -80
    min_value: -100
    max_value: 0
    step: 5
  - id: horizontal_maximum_movement
    platform: template
    name: horizontal_maximal_movement
    optimistic: True
    restore_value: True
    initial_value: 80
    min_value: 0
    max_value: 100
    step: 5
  - id: vertical_minimum_movement
    platform: template
    name: vertical_minimal_movement
    optimistic: True
    restore_value: True
    initial_value: -80
    min_value: -100
    max_value: 0
    step: 5
  - id: vertical_maximum_movement
    platform: template
    name: vertical_maximal_movement
    optimistic: True
    restore_value: True
    initial_value: 80
    min_value: 0
    max_value: 100
    step: 5

  # Speed = total movement duration in ms
  - id: horizontal_minimal_speed
    platform: template
    name: horizontal_minimal_speed
    optimistic: True
    restore_value: True
    initial_value: 1000
    min_value: 100
    max_value: 5000
    step: 100
  - id: horizontal_maximal_speed
    platform: template
    name: horizontal_maximal_speed
    optimistic: True
    restore_value: True
    initial_value: 2000
    min_value: 100
    max_value: 5000
    step: 100
  - id: vertical_minimal_speed
    platform: template
    name: vertical_minimal_speed
    optimistic: True
    restore_value: True
    initial_value: 1000
    min_value: 100
    max_value: 5000
    step: 100
  - id: vertical_maximal_speed
    platform: template
    name: vertical_maximal_speed
    optimistic: True
    restore_value: True
    initial_value: 2000
    min_value: 100
    max_value: 5000
    step: 100

# ---------------------------------------------------------------------------
# BINARY SENSORS
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: template
    id: horizontal_movement_in_progress
    name: "Horizontal movement in progress"
  - platform: template
    id: vertical_movement_in_progress
    name: "Vertical movement in progress"

# ---------------------------------------------------------------------------
# SENSORS
# ---------------------------------------------------------------------------
sensor:
  - name: "cat_playing_session_progress"
    platform: template
    unit_of_measurement: "%"
    update_interval: 5s
    accuracy_decimals: 1
    lambda: |-
      long start = id(session_start_time);
      long end   = id(session_end_time);
      if (start == 0 || end == 0 || end <= start) return 0.0f;
      time_t now = time(nullptr);
      float pct = (float)(now - start) / (float)(end - start) * 100.0f;
      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return (float)((int)(pct + 0.5f));

  - name: "cat_playing_session_remaining"
    platform: template
    unit_of_measurement: "s"
    update_interval: 5s
    lambda: |-
      long start = id(session_start_time);
      long end   = id(session_end_time);
      if (start == 0 || end == 0 || end <= start) return 0.0f;
      time_t now = time(nullptr);
      long remaining = end - now;
      return (float)(remaining < 0 ? 0 : remaining);


# ---------------------------------------------------------------------------
# INTERVAL — core of the non-blocking state machine
#
# Each tick (100 ms fixed) advances the two axes independently.
# The ESPHome loop is never blocked: Wi-Fi and HA API keep running continuously.
#
# State machine per axis:
#   state == 0  →  IDLE    : session finished or not started
#   state == 1  →  MOVING  : applying a step toward the target
#   state == 2  →  PAUSING : waiting for the inter-movement pause to end
# ---------------------------------------------------------------------------
interval:
  - interval: 100ms
    then:
      - lambda: |-
          time_t now_sec = time(nullptr);
          uint32_t now_ms = millis();  // internal ESP timer, ms precision

          // ----------------------------------------------------------------
          // HORIZONTAL AXIS
          // ----------------------------------------------------------------
          if (id(state_horizontal) == 0) {
            // IDLE — nothing to do
          }
          else if (id(state_horizontal) == 1) {
            // MOVING — advance one step
            id(horizontal_movement_in_progress).publish_state(true);
            id(servo_horizontal_position) += id(horizontal_step);

            // Directional clamp if the target is exceeded
            if (id(horizontal_step) > 0.0f) {
              if (id(servo_horizontal_position) >= id(servo_target_horizontal_position))
                id(servo_horizontal_position) = id(servo_target_horizontal_position);
            } else {
              if (id(servo_horizontal_position) <= id(servo_target_horizontal_position))
                id(servo_horizontal_position) = id(servo_target_horizontal_position);
            }

            id(servo_horizontal_slider).publish_state(id(servo_horizontal_position));
            ESP_LOGI("custom", "[H] MOVE → pos=%.2f  target=%.2f", id(servo_horizontal_position), id(servo_target_horizontal_position));

            // Target reached → PAUSING
            if (fabsf(id(servo_horizontal_position) - id(servo_target_horizontal_position)) < 0.5f) {
              id(horizontal_movement_in_progress).publish_state(false);
              int h_min_p = (int)id(horizontal_minimal_pause).state;
              int h_max_p = (int)id(horizontal_maximal_pause).state;
              int pause_range = h_max_p - h_min_p;
              int pause_ms = (pause_range > 0) ? (rand() % pause_range) + h_min_p : h_min_p;
              id(horizontal_pause_until_ms) = now_ms + pause_ms;
              ESP_LOGI("custom", "[H] PAUSE %d ms", pause_ms);
              id(state_horizontal) = 2;
            }

            // Session finished → IDLE
            if (now_sec > id(session_end_time)) {
              id(horizontal_movement_in_progress).publish_state(false);
              id(state_horizontal) = 0;
            }
          }
          else if (id(state_horizontal) == 2) {
            // PAUSING — wait for the pause to finish
            if (now_sec > id(session_end_time)) {
              id(state_horizontal) = 0;
            } else if (now_ms >= id(horizontal_pause_until_ms)) {
              // Pause elapsed → new movement
              int h_min_m = (int)id(horizontal_minimum_movement).state;
              int h_max_m = (int)id(horizontal_maximum_movement).state;
              int m_range = h_max_m - h_min_m;
              float new_target = (m_range > 0) ? (float)((rand() % m_range) + h_min_m) : (float)h_min_m;
              id(servo_target_horizontal_position) = new_target;

              int h_min_s = (int)id(horizontal_minimal_speed).state;
              int h_max_s = (int)id(horizontal_maximal_speed).state;
              int s_range = h_max_s - h_min_s;
              float move_duration_ms = (s_range > 0) ? (float)((rand() % s_range) + h_min_s) : (float)h_min_s;

              int nb_of_split = (int)(move_duration_ms / 100.0f);
              if (nb_of_split < 1) nb_of_split = 1;

              float delta = id(servo_target_horizontal_position) - id(servo_horizontal_position);
              id(horizontal_step) = delta / (float)nb_of_split;
              if (id(horizontal_step) == 0.0f) id(horizontal_step) = 0.001f;

              ESP_LOGI("custom", "[H] NEW MOVE  pos=%.2f  target=%.2f  step=%.3f  splits=%d",
                       id(servo_horizontal_position), new_target, id(horizontal_step), nb_of_split);
              id(state_horizontal) = 1;
            }
          }

          // ----------------------------------------------------------------
          // VERTICAL AXIS
          // ----------------------------------------------------------------
          if (id(state_vertical) == 0) {
            // IDLE — nothing to do
          }
          else if (id(state_vertical) == 1) {
            // MOVING
            id(vertical_movement_in_progress).publish_state(true);
            id(servo_vertical_position) += id(vertical_step);

            if (id(vertical_step) > 0.0f) {
              if (id(servo_vertical_position) >= id(servo_target_vertical_position))
                id(servo_vertical_position) = id(servo_target_vertical_position);
            } else {
              if (id(servo_vertical_position) <= id(servo_target_vertical_position))
                id(servo_vertical_position) = id(servo_target_vertical_position);
            }

            id(servo_vertical_slider).publish_state(id(servo_vertical_position));
            ESP_LOGI("custom", "[V] MOVE → pos=%.2f  target=%.2f", id(servo_vertical_position), id(servo_target_vertical_position));

            if (fabsf(id(servo_vertical_position) - id(servo_target_vertical_position)) < 0.5f) {
              id(vertical_movement_in_progress).publish_state(false);
              int v_min_p = (int)id(vertical_minimal_pause).state;
              int v_max_p = (int)id(vertical_maximal_pause).state;
              int pause_range = v_max_p - v_min_p;
              int pause_ms = (pause_range > 0) ? (rand() % pause_range) + v_min_p : v_min_p;
              id(vertical_pause_until_ms) = now_ms + pause_ms;
              ESP_LOGI("custom", "[V] PAUSE %d ms", pause_ms);
              id(state_vertical) = 2;
            }

            if (now_sec > id(session_end_time)) {
              id(vertical_movement_in_progress).publish_state(false);
              id(state_vertical) = 0;
            }
          }
          else if (id(state_vertical) == 2) {
            if (now_sec > id(session_end_time)) {
              id(state_vertical) = 0;
            } else if (now_ms >= id(vertical_pause_until_ms)) {
              // Pause elapsed → new movement
              int v_min_m = (int)id(vertical_minimum_movement).state;
              int v_max_m = (int)id(vertical_maximum_movement).state;
              int m_range = v_max_m - v_min_m;
              float new_target = (m_range > 0) ? (float)((rand() % m_range) + v_min_m) : (float)v_min_m;
              id(servo_target_vertical_position) = new_target;

              int v_min_s = (int)id(vertical_minimal_speed).state;
              int v_max_s = (int)id(vertical_maximal_speed).state;
              int s_range = v_max_s - v_min_s;
              float move_duration_ms = (s_range > 0) ? (float)((rand() % s_range) + v_min_s) : (float)v_min_s;

              int nb_of_split = (int)(move_duration_ms / 100.0f);
              if (nb_of_split < 1) nb_of_split = 1;

              float delta = id(servo_target_vertical_position) - id(servo_vertical_position);
              id(vertical_step) = delta / (float)nb_of_split;
              if (id(vertical_step) == 0.0f) id(vertical_step) = 0.001f;

              ESP_LOGI("custom", "[V] NEW MOVE  pos=%.2f  target=%.2f  step=%.3f  splits=%d",
                       id(servo_vertical_position), new_target, id(vertical_step), nb_of_split);
              id(state_vertical) = 1;
            }
          }

# ---------------------------------------------------------------------------
# SCRIPTS
# ---------------------------------------------------------------------------
script:

  - id: script_init_session
    mode: single
    then:
      - lambda: |-
          time_t now = time(nullptr);
          id(session_start_time) = now;
          id(session_end_time)   = now + ((int)id(cat_playing_session_duration_minutes).state * 60);
          ESP_LOGI("custom", "SESSION START  duration=%d min  end=%ld",
                   (int)id(cat_playing_session_duration_minutes).state,
                   id(session_end_time));

          id(servo_horizontal_position)        = 0.0f;
          id(servo_target_horizontal_position) = 0.0f;
          id(servo_vertical_position)          = 0.0f;
          id(servo_target_vertical_position)   = 0.0f;

          // Both axes start in PAUSING with zero delay
          // → on the first tick they compute their first movement
          id(horizontal_pause_until_ms) = 0;
          id(vertical_pause_until_ms)   = 0;
          id(state_horizontal) = 2;
          id(state_vertical)   = 2;

  - id: script_horizontal_left
    mode: single
    then:
      - lambda: |-
          id(horizontal_movement_in_progress).publish_state(true);
          id(servo_target_horizontal_position) = id(horizontal_minimum_movement).state;
          id(servo_horizontal_position) = id(servo_target_horizontal_position);
          id(servo_horizontal_slider).publish_state(id(servo_horizontal_position));
          id(horizontal_movement_in_progress).publish_state(false);

  - id: script_horizontal_center
    mode: single
    then:
      - lambda: |-
          id(horizontal_movement_in_progress).publish_state(true);
          id(servo_target_horizontal_position) = (id(horizontal_maximum_movement).state + id(horizontal_minimum_movement).state) / 2.0f;
          id(servo_horizontal_position) = id(servo_target_horizontal_position);
          id(servo_horizontal_slider).publish_state(id(servo_horizontal_position));
          id(horizontal_movement_in_progress).publish_state(false);

  - id: script_horizontal_right
    mode: single
    then:
      - lambda: |-
          id(horizontal_movement_in_progress).publish_state(true);
          id(servo_target_horizontal_position) = id(horizontal_maximum_movement).state;
          id(servo_horizontal_position) = id(servo_target_horizontal_position);
          id(servo_horizontal_slider).publish_state(id(servo_horizontal_position));
          id(horizontal_movement_in_progress).publish_state(false);

  - id: script_vertical_up
    mode: single
    then:
      - lambda: |-
          id(servo_target_vertical_position) = id(vertical_maximum_movement).state;
          id(servo_vertical_position) = id(servo_target_vertical_position);
          id(servo_vertical_slider).publish_state(id(servo_vertical_position));

  - id: script_vertical_center
    mode: single
    then:
      - lambda: |-
          id(servo_target_vertical_position) = (id(vertical_maximum_movement).state + id(vertical_minimum_movement).state) / 2.0f;
          id(servo_vertical_position) = id(servo_target_vertical_position);
          id(servo_vertical_slider).publish_state(id(servo_vertical_position));

  - id: script_vertical_down
    mode: single
    then:
      - lambda: |-
          id(servo_target_vertical_position) = id(vertical_minimum_movement).state;
          id(servo_vertical_position) = id(servo_target_vertical_position);
          id(servo_vertical_slider).publish_state(id(servo_vertical_position));

  - id: script_stop_all
    mode: single
    then:
      - lambda: |-
          id(state_horizontal) = 0;
          id(state_vertical)   = 0;
          id(horizontal_movement_in_progress).publish_state(false);
          id(vertical_movement_in_progress).publish_state(false);
          time_t now = time(nullptr);
          id(session_start_time) = now;
          id(session_end_time)   = now;
          // Stow position: vertical at the physical minimum (outside end stops), horizontal at center
          id(servo_vertical_position)   = -100.0f;
          id(servo_horizontal_position) = (id(horizontal_maximum_movement).state + id(horizontal_minimum_movement).state) / 2.0f;
          id(servo_vertical_slider).publish_state(id(servo_vertical_position));
          id(servo_horizontal_slider).publish_state(id(servo_horizontal_position));

# ---------------------------------------------------------------------------
# BUTTONS
# ---------------------------------------------------------------------------
button:
  - id: button_full_range_play
    platform: template
    name: "Full-range play"
    on_press:
      then:
        - script.execute: script_stop_all
        - script.wait: script_stop_all
        - script.execute: script_init_session

  - id: button_stop
    platform: template
    name: "Stop everything and stow"
    on_press:
      then:
        - script.execute: script_stop_all

  # Manual movements (9 positions)
  - id: button_move_up_left
    platform: template
    name: "Shake up left"
    on_press:
      then:
        - script.execute: script_stop_all
        - script.wait: script_stop_all
        - script.execute: script_vertical_up
        - script.execute: script_horizontal_left

  - id: button_move_up
    platform: template
    name: "Shake up"
    on_press:
      then:
        - script.execute: script_stop_all
        - script.wait: script_stop_all
        - script.execute: script_vertical_up
        - script.execute: script_horizontal_center

  - id: button_move_up_right
    platform: template
    name: "Shake up right"
    on_press:
      then:
        - script.execute: script_stop_all
        - script.wait: script_stop_all
        - script.execute: script_vertical_up
        - script.execute: script_horizontal_right

  - id: button_move_left
    platform: template
    name: "Shake left"
    on_press:
      then:
        - script.execute: script_stop_all
        - script.wait: script_stop_all
        - script.execute: script_vertical_center
        - script.execute: script_horizontal_left

  - id: button_move_middle
    platform: template
    name: "Shake middle"
    on_press:
      then:
        - script.execute: script_stop_all
        - script.wait: script_stop_all
        - script.execute: script_vertical_center
        - script.execute: script_horizontal_center

  - id: button_move_right
    platform: template
    name: "Shake right"
    on_press:
      then:
        - script.execute: script_stop_all
        - script.wait: script_stop_all
        - script.execute: script_vertical_center
        - script.execute: script_horizontal_right

  - id: button_move_down_left
    platform: template
    name: "Shake down left"
    on_press:

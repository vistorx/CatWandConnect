      then:
        - script.execute: script_stop_all
        - script.wait: script_stop_all
        - script.execute: script_vertical_down
        - script.execute: script_horizontal_center

  - id: button_move_down_right
    platform: template
    name: "Shake down right"
    on_press:
      then:
        - script.execute: script_stop_all
        - script.wait: script_stop_all
        - script.execute: script_vertical_down
        - script.execute: script_horizontal_right
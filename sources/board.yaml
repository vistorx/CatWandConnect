type: grid
cards:
  - type: custom:mushroom-title-card
    title: Play session
    alignment: center
  - type: button
    show_name: true
    show_icon: true
    entity: button.cat_playing_platform_stop_everything_and_stow
    icon: mdi:stop-circle-outline
    name: STOP & STOW
    tap_action:
      action: perform-action
      perform_action: button.press
      data: {}
      target:
        entity_id: button.cat_playing_platform_stop_everything_and_stow
    show_state: false
    icon_height: 50px
    grid_options:
      columns: 12
      rows: 2
  - type: entities
    entities:
      - entity: button.cat_playing_platform_full_range_play
        name: Full-range play
        icon: mdi:all-inclusive-box-outline
      - entity: number.cat_playing_platform_cat_playing_session_duration_minutes
        name: Duration
        type: custom:numberbox-card
        icon: mdi:timelapse
        unit: Min
      - entity: sensor.cat_playing_platform_cat_playing_session_progress
        secondary_info: none
        icon: mdi:camera-timer
        name: Progress
    grid_options:
      columns: 12
      rows: auto
    show_header_toggle: false
  - show_name: false
    show_icon: true
    type: button
    icon: mdi:arrow-top-left
    tap_action:
      action: perform-action
      perform_action: button.press
      data: {}
      target:
        entity_id: button.cat_playing_platform_shake_up_left
    grid_options:
      columns: 4
      rows: 2
    show_state: false
    entity: button.cat_playing_platform_shake_up_left
  - type: button
    entity: button.cat_playing_platform_shake_up
    icon: mdi:arrow-up
    show_icon: true
    show_name: false
    tap_action:
      action: call-service
      service: button.press
      service_data:
        entity_id: button.cat_playing_platform_shake_up
    grid_options:
      columns: 4
      rows: 2
  - type: button
    entity: button.cat_playing_platform_shake_up_right
    icon: mdi:arrow-top-right
    show_icon: true
    show_name: false
    tap_action:
      action: call-service
      service: button.press
      service_data:
        entity_id: button.cat_playing_platform_shake_up_right
    grid_options:
      columns: 4
      rows: 2
  - type: button
    entity: button.cat_playing_platform_shake_left
    icon: mdi:arrow-left
    show_icon: true
    show_name: false
    tap_action:
      action: call-service
      service: button.press
      service_data:
        entity_id: button.cat_playing_platform_shake_left
    grid_options:
      columns: 4
      rows: 2
  - type: button
    entity: button.cat_playing_platform_shake_middle
    icon: mdi:cat
    show_icon: true
    show_name: false
    tap_action:
      action: call-service
      service: button.press
      service_data:
        entity_id: button.cat_playing_platform_shake_middle
    grid_options:
      columns: 4
      rows: 2
  - type: button
    entity: button.cat_playing_platform_shake_right
    icon: mdi:arrow-right
    show_icon: true
    show_name: false
    tap_action:
      action: call-service
      service: button.press
      service_data:
        entity_id: button.cat_playing_platform_shake_right
    grid_options:
      columns: 4
      rows: 2
  - type: button
    entity: button.cat_playing_platform_shake_down_left
    icon: mdi:arrow-bottom-left
    show_icon: true
    show_name: false
    tap_action:
      action: call-service
      service: button.press
      service_data:
        entity_id: button.cat_playing_platform_shake_down_left
    grid_options:
      columns: 4
      rows: 2
  - type: button
    entity: button.cat_playing_platform_shake_down
    icon: mdi:arrow-down
    show_icon: true
    show_name: false
    tap_action:
      action: call-service
      service: button.press
      service_data:
        entity_id: button.cat_playing_platform_shake_down
    grid_options:
      columns: 4
      rows: 2
  - type: button
    entity: button.cat_playing_platform_shake_down_right
    icon: mdi:arrow-bottom-right
    show_icon: true
    show_name: false
    tap_action:
      action: call-service
      service: button.press
      service_data:
        entity_id: button.cat_playing_platform_shake_down_right
    grid_options:
      columns: 4
      rows: 2
  - type: vertical-stack
    cards:
      - features:
          - type: numeric-input
            style: slider
        type: tile
        name: Servo Horizontal
        icon: mdi:arrow-left-right
        features_position: inline
        vertical: false
        entity: number.cat_playing_platform_horizontal_servo_slider
        hide_state: true
        tap_action:
          action: none
        icon_tap_action:
          action: none
      - features:
          - type: numeric-input
            style: slider
        type: tile
        name: Servo Vertical
        icon: mdi:arrow-up-down
        features_position: inline
        vertical: false
        entity: number.cat_playing_platform_vertical_servo_slider
        hide_state: true
        tap_action:
          action: none
        icon_tap_action:
          action: none
  - type: custom:expander-card
    title: Settings
    child-margin-top: 0.6em
    padding: 0
    cards:
      - type: vertical-stack
        title: Amplitude
        cards:
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_horizontal_maximal_movement
            name: Horizontal maximum
            unit: "%"
            icon: mdi:arrow-up
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_horizontal_minimal_movement
            name: Horizontal minimum
            unit: "%"
            icon: mdi:arrow-down
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_vertical_maximal_movement
            name: Vertical maximum
            unit: "%"
            icon: mdi:arrow-up
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_vertical_minimal_movement
            name: Vertical minimum
            unit: "%"
            icon: mdi:arrow-down
      - type: vertical-stack
        title: Speed
        cards:
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_horizontal_maximal_speed
            name: Horizontal maximum
            unit: s
            icon: mdi:arrow-up
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_horizontal_minimal_speed
            name: Horizontal minimum
            unit: s
            icon: mdi:arrow-down
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_vertical_maximal_speed
            name: Vertical maximum
            unit: s
            icon: mdi:arrow-up
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_vertical_minimal_speed
            name: Vertical minimum
            unit: s
            icon: mdi:arrow-down
      - type: vertical-stack
        title: Pauses
        cards:
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_horizontal_maximal_pause
            name: Horizontal maximum
            unit: ms
            icon: mdi:arrow-up
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_horizontal_minimal_pause
            name: Horizontal minimum
            unit: ms
            icon: mdi:arrow-down
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_vertical_maximal_pause
            name: Vertical maximum
            unit: ms
            icon: mdi:arrow-up
          - type: custom:numberbox-card
            entity: number.cat_playing_platform_vertical_minimal_pause
            name: Vertical minimum
            unit: ms
            icon: mdi:arrow-down
      - type: horizontal-stack
        title: Inversions
        cards:
          - name: Horizontal inversion
            type: custom:mushroom-entity-card
            entity: switch.cat_playing_platform_horizontal_inversion
            primary_info: name
            tap_action:
              action: toggle
          - name: Vertical inversion
            type: custom:mushroom-entity-card
            entity: switch.cat_playing_platform_vertical_inversion
            primary_info: name
            tap_action:
              action: toggle

name: Release

# A vX.Y.Z tag publishes a stable release, a vX.Y.Z-beta.N tag a pre-release.
# Both build every chip, publish the GitHub release, then start the Pages
# workflow (pages.yml), which rebuilds the website and the web flasher with its
# Stable and Beta channels. Running it by hand is a dry run that publishes
# nothing. To republish the website and the flasher alone, run the Pages
# workflow by hand.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Robot core tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native
      - run: node tools/check_lang.mjs
      - run: python tools/test_flasher_site.py
      - run: python tools/test_release_notes.py

  build:
    name: Build ${{ matrix.env }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        env: [esp32, esp32s3, esp32c3]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev+${GITHUB_SHA::7}"; fi
          echo "CWC_VERSION=$v" >> "$GITHUB_ENV"
      - run: pio run -e ${{ matrix.env }}
      - name: Collect binaries
        run: |
          mkdir -p ../dist
          cp .pio/build/${{ matrix.env }}/firmware.bin ../dist/catwandconnect-${{ matrix.env }}-ota.bin
          cp .pio/build/${{ matrix.env }}/factory.bin ../dist/catwandconnect-${{ matrix.env }}-factory.bin
      - uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.env }}
          path: dist/

  preview:
    name: Flasher preview
    # Dry run only: the flasher with this build as its Beta channel, kept as an artifact.
    if: github.ref_type != 'tag'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist/
      - name: Assemble
        run: |
          v="0.0.0-dev+${GITHUB_SHA::7}"
          mkdir -p site/flasher/beta site/flasher/media
          cp flasher/index.html site/flasher/
          cp -r media/logo site/flasher/media/
          cp dist/*-factory.bin dist/*-ota.bin site/flasher/beta/
          python firmware/tools/flasher_manifest.py "$v" site/flasher/beta/manifest.json
          ota='{"ESP32": "beta/catwandconnect-esp32-ota.bin", "ESP32-S3": "beta/catwandconnect-esp32s3-ota.bin", "ESP32-C3": "beta/catwandconnect-esp32c3-ota.bin"}'
          echo "{\"beta\": {\"version\": \"$v\", \"tag\": \"\", \"notes\": \"\", \"summary\": \"\", \"ota\": $ota}}" > site/flasher/channels.json
      - uses: actions/upload-artifact@v6
        with:
          name: flasher-preview
          path: site/

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    # The `release` environment requires the owner's approval, so a pushed tag
    # publishes nothing until the owner clicks Approve (docs/releasing.md).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist/
      # Notes come from the tag's CHANGELOG.md section (tools/release_notes.py);
      # a tag without one fails here, before anything is published.
      - name: Release notes from CHANGELOG.md
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          python firmware/tools/release_notes.py notes "$GITHUB_REF_NAME" "$previous" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.bin
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  announce-discord:
    name: Announce on Discord
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Pitch and highlights of the CHANGELOG.md section in #announcements.
      # Never fails the release.
      - name: Post to #announcements
        env:
          WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "No DISCORD_ANNOUNCE_WEBHOOK secret"; exit 0; }
          url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          python firmware/tools/release_notes.py discord "$GITHUB_REF_NAME" "CatWandConnect firmware" "$url" > msg.txt
          python -c "import json; print(json.dumps({'content': open('msg.txt').read(), 'allowed_mentions': {'parse': []}}))" > msg.json
          curl -fsS -H 'Content-Type: application/json' --data @msg.json "$WEBHOOK" || echo "Discord post failed"

  notify-discord:
    name: Notify Discord threads
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Posts in every #support thread linked to an issue this release closes
      # (relay/scripts/notify-release.mjs). Never fails the release.
      - run: node relay/scripts/notify-release.mjs "${{ github.ref_name }}" || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1559112591748366357'

  pages:
    name: Republish the website and the web flasher
    # The Pages workflow is the only one deploying GitHub Pages. It runs on main
    # and reads the releases, so it starts once this release exists.
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

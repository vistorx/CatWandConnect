name: Support relay

# Tests and deploys the Support relay (relay/, a Cloudflare Worker) when it
# changes on main. Secrets live only in this repository's Actions secrets:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPPORT_APP_ID,
# SUPPORT_APP_PRIVATE_KEY, DISCORD_BOT_TOKEN, DISCORD_PUBLIC_KEY,
# DISCORD_APPLICATION_ID (docs/support-relay.md).

on:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy the Support relay
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          wranglerVersion: '4'
          secrets: |
            SUPPORT_APP_ID
            SUPPORT_APP_PRIVATE_KEY
            DISCORD_BOT_TOKEN
            DISCORD_PUBLIC_KEY
        env:
          SUPPORT_APP_ID: ${{ secrets.SUPPORT_APP_ID }}
          SUPPORT_APP_PRIVATE_KEY: ${{ secrets.SUPPORT_APP_PRIVATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      - name: Register the /issue command on Discord
        run: node scripts/register-commands.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_GUILD_ID: '1559112591748366357'
      - name: Check the deployed relay answers
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Relay: $URL"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/status"; then echo; exit 0; fi
            sleep 10
          done
          exit 1

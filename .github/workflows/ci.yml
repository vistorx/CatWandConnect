name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runners are pinned to ubuntu-24.04 while ubuntu-latest migrates to Ubuntu 26.04
# (from 2026-10-19, #134); move to ubuntu-26.04 once a test run passes there.
jobs:
  test:
    name: Robot core tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
      - name: Language files match en.json
        run: node tools/check_lang.mjs
      - name: Flasher channel rules
        run: python tools/test_flasher_site.py
      - name: Support relay tests
        working-directory: relay
        run: node --test

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [esp32, esp32s3, esp32c3]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}

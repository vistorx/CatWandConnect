<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CatWandConnect</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#111113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 data-i18n="calibration.title"></h1>
  <a href="/" class="nav" data-i18n="nav.back"></a>
</header>

<main class="form-page wizard">
  <p class="progress" id="progress"></p>
  <h2 id="step-title"></h2>
  <p id="step-text"></p>

  <section id="nudges"></section>

  <p class="message" role="status" id="message"></p>

  <div class="actions">
    <button id="primary" class="primary"></button>
    <button id="secondary" class="secondary" hidden></button>
    <button id="cancel" class="secondary" data-i18n="calibration.cancel" hidden></button>
  </div>
</main>

<script src="i18n.js"></script>
<script src="calibrate.js"></script>
</body>
</html>

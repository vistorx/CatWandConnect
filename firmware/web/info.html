<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CatWandConnect</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#111113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 data-i18n="info.title"></h1>
  <a href="settings.html#robot" class="nav" data-i18n="nav.back"></a>
</header>

<main class="form-page">
  <p class="hint"><span data-i18n="info.report"></span> <a href="help.html" data-i18n="help.open"></a></p>
  <dl id="info" class="info"></dl>
  <button id="copy" class="secondary" data-i18n="info.copy"></button>
  <p class="message" role="status" id="message"></p>

  <h2 data-i18n="diag.title"></h2>
  <p class="hint" data-i18n="diag.hint"></p>
  <pre id="report" class="report" tabindex="0"></pre>
  <div class="actions">
    <button id="report-copy" class="secondary" data-i18n="diag.copy"></button>
    <button id="report-download" class="secondary" data-i18n="diag.download"></button>
  </div>
  <p class="message" role="status" id="report-message"></p>
  <details class="full-report">
    <summary data-i18n="diag.full.title"></summary>
    <p class="hint" data-i18n="diag.full.hint"></p>
    <button id="report-full" class="secondary" data-i18n="diag.full.download"></button>
  </details>
</main>

<script src="i18n.js"></script>
<script src="info.js"></script>
</body>
</html>

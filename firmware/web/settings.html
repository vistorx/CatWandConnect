<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CatWandConnect</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#111113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 data-i18n="settings.title"></h1>
  <nav class="header-links">
    <a href="info.html" class="nav" data-i18n="nav.info"></a>
    <a href="/" class="nav" data-i18n="nav.back"></a>
  </nav>
</header>

<main class="form-page">
  <nav id="tabs" class="tabs" role="tablist"></nav>

  <div id="tab-motion" class="tab-panel" role="tabpanel" hidden>
    <form id="limits">
      <h2 data-i18n="settings.limits"></h2>
      <p class="hint" data-i18n="settings.limits.hint"></p>
      <a href="calibrate.html" class="button-link secondary" data-i18n="settings.calibrate"></a>
      <div id="limits-axes"></div>
      <button class="primary" data-i18n="settings.save"></button>
      <p class="message" role="status"></p>
    </form>
    <form id="motion">
      <h2 data-i18n="settings.motion"></h2>
      <p class="hint" data-i18n="settings.motion.hint"></p>
      <a href="speed.html" class="button-link secondary" data-i18n="settings.tune_speed"></a>
      <div id="motion-axes"></div>
      <button class="primary" data-i18n="settings.save"></button>
      <p class="message" role="status"></p>
    </form>
  </div>

  <div id="tab-hardware" class="tab-panel" role="tabpanel" hidden>
    <form id="hardware">
      <h2 data-i18n="settings.hardware"></h2>
      <p class="hint" data-i18n="settings.hardware.hint"></p>
      <div id="hardware-axes"></div>
      <button class="primary" data-i18n="settings.hardware.save"></button>
      <p class="message" role="status"></p>
    </form>
  </div>

  <div id="tab-network" class="tab-panel" role="tabpanel" hidden>
    <section id="wifi">
      <h2 data-i18n="settings.wifi"></h2>
      <p id="wifi-state" class="hint"></p>
      <fieldset id="wifi-details" hidden>
        <div class="field wide">
          <span data-i18n="settings.wifi.network"></span>
          <output id="wifi-ssid"></output>
        </div>
        <div class="field wide">
          <span data-i18n="settings.wifi.ip"></span>
          <output id="wifi-ip"></output>
        </div>
        <div class="field wide">
          <span data-i18n="settings.address"></span>
          <output id="wifi-host" class="unit"></output>
        </div>
      </fieldset>
      <a id="wifi-setup" href="/setup.html" class="link-button" data-i18n="settings.wifi.setup" hidden></a>
      <button id="wifi-change" type="button" class="secondary" data-i18n="settings.wifi.change" hidden></button>
      <div id="wifi-confirm" class="note" role="alertdialog" aria-labelledby="wifi-confirm-text" hidden>
        <p id="wifi-confirm-text" data-i18n="settings.wifi.change.explain"></p>
        <p data-i18n="settings.wifi.change.fallback"></p>
        <div class="actions">
          <a id="wifi-confirm-go" href="/setup.html" class="link-button" data-i18n="settings.wifi.change.go"></a>
          <button id="wifi-confirm-cancel" type="button" class="secondary" data-i18n="settings.wifi.change.cancel"></button>
        </div>
      </div>
    </section>
    <form id="mqtt">
      <h2 data-i18n="mqtt.title"></h2>
      <p class="hint" data-i18n="mqtt.hint"></p>
      <p class="hint"><a href="https://vistorx.github.io/CatWandConnect/home-assistant/" target="_blank" rel="noopener" data-i18n="mqtt.guide"></a></p>
      <fieldset>
        <div class="field wide">
          <label for="mqtt-enabled" data-i18n="mqtt.enabled"></label>
          <input id="mqtt-enabled" type="checkbox">
        </div>
        <div class="field wide">
          <label for="mqtt-host" data-i18n="mqtt.host"></label>
          <input id="mqtt-host" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="homeassistant.local">
        </div>
        <div class="field wide">
          <label for="mqtt-port" data-i18n="mqtt.port"></label>
          <input id="mqtt-port" type="number" min="1" max="65535" inputmode="numeric">
        </div>
        <div class="field wide">
          <label for="mqtt-user" data-i18n="mqtt.user"></label>
          <input id="mqtt-user" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field wide">
          <label for="mqtt-password" data-i18n="mqtt.password"></label>
          <input id="mqtt-password" type="password" autocomplete="new-password">
        </div>
        <div class="field wide">
          <span data-i18n="mqtt.status"></span>
          <output id="mqtt-status"></output>
        </div>
      </fieldset>
      <button class="primary" data-i18n="settings.save"></button>
      <p class="message" role="status"></p>
    </form>
  </div>

  <div id="tab-robot" class="tab-panel" role="tabpanel" hidden>
    <form id="device">
      <h2 data-i18n="settings.device"></h2>
      <p class="hint" data-i18n="settings.device.hint"></p>
      <fieldset>
        <div class="field wide">
          <label for="name" data-i18n="settings.name"></label>
          <input id="name" maxlength="32" required>
        </div>
        <div class="field wide">
          <span data-i18n="settings.address"></span>
          <output id="address" class="unit"></output>
        </div>
        <div class="field wide">
          <label for="language" data-i18n="settings.language"></label>
          <select id="language"></select>
        </div>
      </fieldset>
      <button class="primary" data-i18n="settings.device.save"></button>
      <p class="message" role="status"></p>
    </form>
    <form id="security">
      <h2 data-i18n="security.title"></h2>
      <p class="hint" data-i18n="security.hint"></p>
      <fieldset>
        <div class="field wide">
          <span data-i18n="security.status"></span>
          <output id="pin-status"></output>
        </div>
        <div class="field wide">
          <label for="pin" data-i18n="security.new"></label>
          <input id="pin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{4,8}" maxlength="8" required>
        </div>
      </fieldset>
      <button class="primary" data-i18n="security.save"></button>
      <button id="pin-remove" type="button" class="secondary" data-i18n="security.remove" hidden></button>
      <p class="message" role="status"></p>
    </form>
    <section id="update">
      <h2 data-i18n="firmware.title"></h2>
      <fieldset>
        <div class="field wide">
          <span data-i18n="firmware.current"></span>
          <output id="firmware-version"></output>
        </div>
        <div class="field wide">
          <label for="update-channel" data-i18n="update.channel"></label>
          <select id="update-channel">
            <option value="stable" data-i18n="update.channel.stable"></option>
            <option value="beta" data-i18n="update.channel.beta"></option>
          </select>
        </div>
      </fieldset>
      <p class="hint" data-i18n="update.channel.hint"></p>
      <p id="update-status" class="hint" role="status"></p>
      <div id="update-available" class="note" hidden>
        <p><strong id="update-title"></strong></p>
        <p id="update-summary"></p>
        <p><a id="update-notes" href="#" target="_blank" rel="noopener" data-i18n="update.notes"></a></p>
        <div class="actions">
          <button id="update-start" type="button" class="primary" data-i18n="update.button"></button>
        </div>
      </div>
      <button id="update-retry" type="button" class="secondary" data-i18n="update.retry" hidden></button>
      <div id="update-confirm" class="note" role="alertdialog" aria-labelledby="update-confirm-text" hidden>
        <p id="update-confirm-text"></p>
        <p data-i18n="update.confirm.keep"></p>
        <div class="actions">
          <button id="update-confirm-go" type="button" class="primary" data-i18n="update.confirm.go"></button>
          <button id="update-confirm-cancel" type="button" class="secondary" data-i18n="settings.wifi.change.cancel"></button>
        </div>
      </div>
      <progress id="update-progress" max="100" value="0" hidden></progress>
      <p id="update-message" class="message" role="status"></p>
    </section>
    <form id="firmware">
      <h2 data-i18n="firmware.manual"></h2>
      <p class="hint" data-i18n="firmware.hint"></p>
      <div id="firmware-hotspot" class="note" hidden>
        <p data-i18n="firmware.hotspot"></p>
        <p><code id="firmware-address"></code> <button id="firmware-copy" type="button" class="secondary" data-i18n="firmware.copy"></button></p>
      </div>
      <fieldset>
        <input id="firmware-file" type="file" accept=".bin,application/octet-stream" required>
        <progress id="firmware-progress" max="100" value="0" hidden></progress>
      </fieldset>
      <button class="primary" data-i18n="firmware.upload"></button>
      <p class="message" role="status"></p>
    </form>
    <section id="about">
      <h2 data-i18n="settings.about"></h2>
      <p class="hint" data-i18n="settings.about.hint"></p>
      <div class="link-stack">
        <a href="info.html" class="link-button" data-i18n="settings.about.open"></a>
        <a href="help.html" class="link-button" data-i18n="help.open"></a>
        <button id="home-screen" type="button" class="text-button" data-i18n="help.home"></button>
      </div>
    </section>
  </div>
</main>

<script src="clock.js"></script>
<script src="i18n.js"></script>
<script src="api.js"></script>
<script src="update.js"></script>
<script src="links.js"></script>
<script src="homescreen.js"></script>
<script src="settings.js"></script>
</body>
</html>

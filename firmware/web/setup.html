<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CatWandConnect</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#111113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>CatWandConnect</h1></header>

<main class="form-page">
  <p data-i18n="setup.intro"></p>
  <form id="form">
    <div class="networks-head">
      <span data-i18n="setup.nearby"></span>
      <button type="button" id="rescan" class="text-button" data-i18n="setup.rescan"></button>
    </div>
    <ul id="networks" class="networks" aria-live="polite"></ul>
    <label for="ssid" data-i18n="setup.network"></label>
    <input id="ssid" name="ssid" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <label for="password" data-i18n="setup.password"></label>
    <input id="password" name="password" type="password" autocomplete="off">
    <button id="connect" class="primary" data-i18n="setup.connect"></button>
  </form>
  <button id="skip" type="button" class="secondary" data-i18n="setup.skip"></button>
  <p class="hint" data-i18n="setup.skip.hint"></p>
  <p class="hint" data-i18n="setup.skip.browser"></p>
  <p id="status" class="hint" role="status"></p>
  <p id="setup-help" class="hint" hidden><a href="help.html" data-i18n="help.stuck"></a></p>
  <details class="full-report">
    <summary data-i18n="setup.problem"></summary>
    <p class="hint" data-i18n="setup.problem.hint"></p>
    <a href="/api/diagnostics" download="catwandconnect-report.txt" class="link-button" data-i18n="diag.download"></a>
    <a href="help.html" class="link-button" data-i18n="setup.problem.save"></a>
  </details>
</main>

<script src="i18n.js"></script>
<script src="api.js"></script>
<script src="setup.js"></script>
</body>
</html>

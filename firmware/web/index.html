<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CatWandConnect</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#111113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="name">CatWandConnect</h1>
  <span id="link" class="link" data-state="offline" data-i18n="link.connecting"></span>
  <a href="settings.html" class="nav" data-i18n="nav.settings"></a>
</header>
<p id="link-help" class="link-help" hidden><a href="https://github.com/vistorx/CatWandConnect/blob/main/docs/troubleshooting.md#the-robot-stopped-responding" target="_blank" rel="noopener" data-i18n="help.stuck"></a></p>

<main>
  <p id="banner" class="banner" hidden>
    <span data-i18n="banner.uncalibrated"></span>
    <a href="calibrate.html" data-i18n="banner.calibrate"></a>
  </p>
  <p id="pending-banner" class="banner" hidden>
    <span data-i18n="pending.banner"></span>
    <a href="help.html" data-i18n="pending.banner.open"></a>
  </p>

  <section class="readout">
    <div><span data-i18n="axis.horizontal"></span><output id="pos-h">–</output></div>
    <div><span data-i18n="axis.vertical"></span><output id="pos-v">–</output></div>
  </section>

  <div id="joystick" class="joystick" role="application" data-i18n-aria="joystick.label">
    <div class="knob"></div>
  </div>
  <p class="hint" data-i18n="joystick.hint"></p>

  <label class="slider">
    <span data-i18n="speed.label"></span>
    <input id="speed" type="range" min="10" max="100" step="5">
    <output id="speed-value"></output>
  </label>

  <section id="play" class="play" aria-labelledby="play-title">
    <h2 id="play-title" data-i18n="play.title"></h2>
    <div id="play-setup" class="play-duration">
      <button id="play-less" type="button" class="secondary" data-i18n-aria="play.less">−</button>
      <label class="play-minutes">
        <input id="play-minutes" type="number" min="1" max="60" step="1" inputmode="numeric" data-i18n-aria="play.duration">
        <span class="unit" data-i18n="play.minutes"></span>
      </label>
      <button id="play-more" type="button" class="secondary" data-i18n-aria="play.more">+</button>
    </div>
    <p id="play-running" class="play-remaining" hidden>
      <span data-i18n="play.remaining"></span>
      <output id="play-remaining">–</output>
    </p>
    <button id="play-toggle" type="button" class="primary" data-i18n="play.start"></button>
    <p id="play-message" class="message" data-kind="error" role="status"></p>
    <p class="hint" data-i18n="play.hint"></p>
  </section>
</main>

<footer class="stow-bar">
  <button id="stow" class="stow" data-i18n="stow.button"></button>
</footer>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>

; CatWandConnect firmware. See docs/getting-started.md for build and test commands.

[platformio]
default_envs = esp32, esp32s3, esp32c3

; Shared settings for every chip target.
[chip]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -DCWC_VERSION=\"0.0.0-dev\"
; Two 1.9 MB app slots for OTA updates; NVS (settings) at the same place as
; the default layout. A 4 MB layout everywhere, so 8 MB boards work too.
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
lib_deps =
  esp32async/ESPAsyncWebServer@3.12.1
  esp32async/AsyncTCP@3.5.0
  bblanchon/ArduinoJson@7.4.3
  knolleary/PubSubClient@2.8
; Embeds web/ into src/web/assets.h before each build.
extra_scripts = pre:tools/embed_web.py

[env:esp32]
extends = chip
board = esp32dev

[env:esp32s3]
extends = chip
board = esp32-s3-devkitc-1

[env:esp32c3]
extends = chip
board = esp32-c3-devkitm-1

; Host build of the Robot core only, for unit tests: `pio test -e native`.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra -Werror
lib_deps = bblanchon/ArduinoJson@7.4.3

; CatWandConnect firmware. See docs/getting-started.md for build and test commands.

[platformio]
default_envs = esp32, esp32s3, esp32c3

; Shared settings for every chip target.
[chip]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall

[env:esp32]
extends = chip
board = esp32dev

[env:esp32s3]
extends = chip
board = esp32-s3-devkitc-1

[env:esp32c3]
extends = chip
board = esp32-c3-devkitm-1

; Host build of the Robot core only, for unit tests: `pio test -e native`.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
; Drop -Wno-unused-private-field once Robot uses its ports (#5).
build_flags = -std=c++17 -Wall -Wextra -Werror -Wno-unused-private-field

; CatWandConnect firmware. See docs/getting-started.md for build and test commands.

[platformio]
default_envs = esp32, esp32s3, esp32c3

; Shared settings for every chip target.
[chip]
; pioarduino 55.03.313 = Arduino-ESP32 3.3.13 on ESP-IDF 5.5 (ADR 0014). The
; official espressif32 platform stops at Arduino-ESP32 2.x. Pinned to an exact
; release: moving it is a firmware change that needs the hardware retest.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
; Two 1.9 MB app slots for OTA updates; NVS (settings) at the same place as
; the default layout. A 4 MB layout everywhere, so 8 MB boards work too.
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
lib_deps =
  esp32async/ESPAsyncWebServer@3.12.1
  esp32async/AsyncTCP@3.5.0
  bblanchon/ArduinoJson@7.4.3
  knolleary/PubSubClient@2.8
; Before each build: the firmware version, and web/ embedded into
; src/web/assets.h. After: factory.bin, the full image for the web flasher.
extra_scripts =
  pre:tools/version.py
  pre:tools/embed_web.py
  post:tools/merge_firmware.py

[env:esp32]
extends = chip
board = esp32dev

[env:esp32s3]
extends = chip
board = esp32-s3-devkitc-1

[env:esp32c3]
extends = chip
board = esp32-c3-devkitm-1

; Host build of the Robot core only, for unit tests: `pio test -e native`.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra -Werror
lib_deps = bblanchon/ArduinoJson@7.4.3

# Remote access prototype (#267): Tailscale (microlink) on a classic ESP32.
# Throwaway: deleted once the results are recorded on #251.
#
# ESP-IDF 5.5 through PlatformIO's espressif32 6.12.0 platform. microlink
# needs ESP-IDF 5.3 or later and is pulled from the ESP Component Registry
# (src/idf_component.yml).

[platformio]
default_envs = esp32

[env:esp32]
platform = platformio/espressif32@6.12.0
framework = espidf
board = esp32dev
board_build.flash_size = 4MB
; Same layout as the robot firmware's min_spiffs: two 1.9 MB app slots,
; so the size figure answers "does it fit next to the robot firmware".
board_build.partitions = partitions.csv
monitor_speed = 115200
